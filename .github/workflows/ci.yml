name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck-lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json

      - name: Install workspaces (portal, backoffice, packages)
        run: npm ci

      - name: Install core
        run: npm ci --prefix core

      - name: Typecheck portal
        run: npm run typecheck:portal

      - name: Typecheck backoffice
        run: npm run typecheck:backoffice

      - name: Typecheck core
        run: npm run typecheck:core

      - name: Lint portal
        run: npm run lint:portal

      - name: Lint backoffice
        run: npm run lint:backoffice

      - name: Test core unit (sin BD)
        run: npm run test:core:unit

      # Lint de core (miles de findings: prettier + no-unsafe-*) y jest frontend
      # aún no se gatean. Ver doc/ROADMAP_MEJORAS.md (fases 4 y 5).
