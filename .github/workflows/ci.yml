name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck-lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json

      - name: Install workspaces (portal, backoffice, packages)
        run: npm ci

      - name: Install core
        run: npm ci --prefix core

      - name: Typecheck portal
        run: npm run typecheck:portal

      - name: Typecheck backoffice
        run: npm run typecheck:backoffice

      - name: Typecheck core
        run: npm run typecheck:core

      - name: Test core unit (sin BD)
        run: npm run test:core:unit

      # Lint y jest frontend: scripts existen pero con deuda previa masiva
      # (eslint miles de findings; jest no declarado en package.json).
      # Ver doc/tsc-debt.md. No se gatean aquí para no bloquear typecheck/unit.
