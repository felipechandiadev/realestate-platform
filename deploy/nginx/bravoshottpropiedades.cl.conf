# Bravoshott Propiedades — nginx (HTTP first; certbot adds SSL)
# Portal :8001 | Backoffice :8002 | Core :8000

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Portal ---
server {
    server_name bravoshottpropiedades.cl www.bravoshottpropiedades.cl bravoschottpropiedades.cl www.bravoschottpropiedades.cl;

    client_max_body_size 100m;  # = bodySizeLimit de Next; un envío puede llevar video (70MB) + fotos

    # Fuerza HTTPS en visitas futuras (p. ej. cuando se escribe el dominio sin esquema).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Una sola versión del sitio para Google: www → dominio principal.
    if ($host = www.bravoshottpropiedades.cl) {
        return 301 https://bravoschottpropiedades.cl$request_uri;
    }
    if ($host = www.bravoschottpropiedades.cl) {
        return 301 https://bravoschottpropiedades.cl$request_uri;
    }
    if ($host = bravoshottpropiedades.cl) {
        return 301 https://bravoschottpropiedades.cl$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bravoschottpropiedades.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bravoschottpropiedades.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# --- Backoffice ---
server {
    server_name admin.bravoshottpropiedades.cl admin.bravoschottpropiedades.cl;

    client_max_body_size 100m;  # = bodySizeLimit de Next; un envío puede llevar video (70MB) + fotos

    # Herramienta interna / API: fuera de los buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bravoschottpropiedades.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bravoschottpropiedades.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# --- Core API ---
server {
    server_name core.bravoshottpropiedades.cl core.bravoschottpropiedades.cl;

    client_max_body_size 100m;  # = bodySizeLimit de Next; un envío puede llevar video (70MB) + fotos

    # Herramienta interna / API: fuera de los buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bravoschottpropiedades.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bravoschottpropiedades.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80;
    listen [::]:80;
    server_name bravoshottpropiedades.cl www.bravoshottpropiedades.cl bravoschottpropiedades.cl www.bravoschottpropiedades.cl;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://bravoschottpropiedades.cl$request_uri;
    }
}
server {
    if ($host = admin.bravoshottpropiedades.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name admin.bravoshottpropiedades.cl;
    return 404; # managed by Certbot


}
server {
    listen 80;
    listen [::]:80;
    server_name admin.bravoschottpropiedades.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    if ($host = core.bravoshottpropiedades.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name core.bravoshottpropiedades.cl;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}