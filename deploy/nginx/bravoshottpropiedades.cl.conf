# Bravoshott Propiedades — nginx (HTTP first; certbot adds SSL)
# Portal :8001 | Backoffice :8002 | Core :8000

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Portal ---
server {
    server_name bravoshottpropiedades.cl www.bravoshottpropiedades.cl;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bravoshottpropiedades.cl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bravoshottpropiedades.cl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# --- Backoffice ---
server {
    server_name admin.bravoshottpropiedades.cl;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bravoshottpropiedades.cl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bravoshottpropiedades.cl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# --- Core API ---
server {
    server_name core.bravoshottpropiedades.cl;

    client_max_body_size 70m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bravoshottpropiedades.cl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bravoshottpropiedades.cl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.bravoshottpropiedades.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = bravoshottpropiedades.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name bravoshottpropiedades.cl www.bravoshottpropiedades.cl;
    return 404; # managed by Certbot




}
server {
    if ($host = admin.bravoshottpropiedades.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name admin.bravoshottpropiedades.cl;
    return 404; # managed by Certbot


}
server {
    if ($host = core.bravoshottpropiedades.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name core.bravoshottpropiedades.cl;
    return 404; # managed by Certbot


}